<nav role="tablist" aria-label="Navegació per seccions">
  @for (tab of tabs; track tab.id) {
    <button
      role="tab"
      [attr.aria-selected]="activeTab() === tab.id"
      [class.active]="activeTab() === tab.id"
      (click)="select(tab.id)"
      (keydown)="onKey($event, tab.id)"
    >
      {{ tab.label }}
    </button>
  }
</nav>
